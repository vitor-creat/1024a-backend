<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="dados"></div>
    <script>
        async function buscaDado(){
            //Buscar dados na API  -> fetch
            const resposta = await fetch("http://localhost:8000/cliente_data_pedido")
            const dados = await resposta.json()
            const divDados = document.getElementById("dados")
            console.log(dados)
            for (let i = 0; i < dados.length; i++) {
                divDados.innerHTML += `<p> Nome: ${dados[i].nome} -- Data do pedido: ${dados[i].datapedido}</p>` 
            }
        }
        buscaDado()
    </script>
</html>
